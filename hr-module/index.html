<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A&D HR">
<title>Ashirwad &amp; Durga Jewellers · HR</title>

<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="styles.css?v=2"><link rel="stylesheet" href="tatgold-theme.css">
</head>
<body>

<div id="boot" class="boot"><div class="boot-mark">A&amp;D</div><p>Loading…</p></div>

<!-- sign in -->
<section id="signin" class="signin" hidden>
  <div class="signin-card">
    <div class="brand"><span class="brand-mark">A&amp;D</span>
      <div><h1>Ashirwad &amp; Durga Jewellers</h1><p>Staff attendance &amp; HR</p></div></div>

    <form id="email-form" class="stack">
      <label for="email">Your work e-mail</label>
      <input class="input" id="email" name="email" type="email" inputmode="email" required
             placeholder="name@adjewellers.com"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit">Send sign-in code</button>
      <p class="note">You will get a 6-digit code by e-mail. One sign-in lasts the day.</p>
    </form>

    <form id="code-form" class="stack" hidden>
      <label for="code">6-digit code sent to <b id="code-target"></b></label>
      <input class="input code-input" id="code" name="code" type="text" inputmode="numeric"
             maxlength="6" pattern="[0-9]{6}" required
             autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit">Sign in</button>
      <button class="btn ghost" type="button" id="code-back">Use a different e-mail</button>
    </form>

    <p class="err" id="signin-error" role="alert" hidden></p>
  </div>
</section>

<!-- app -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-left"><span class="brand-mark sm">A&amp;D</span><h2 id="screen-name">HR</h2></div>
    <div class="topbar-right"><span class="who" id="who"></span>
      <button class="btn ghost sm" id="signout" type="button">Sign out</button></div>
  </header>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>


<script>window.HR_CONFIG={COMPANY:"TatGold ERP",COMPANY_LEGAL:"Ashirwad Dwarka Jewellars Private Limited"};</script>
<script src="hr-core.js?v=1"></script>
<script src="app.js?v=1"></script>
<script src="attendance-camera.js?v=1"></script>
<script src="attendance.js?v=1"></script>
<script src="hr.js?v=1"></script>
<script>
  window.HRApp && HRApp.start();
</script>
</body>
</html>
